# Сборка установщиков: Windows (PyInstaller + Inno Setup) и Linux (Flatpak).
# Запускается вручную и на тег vX.Y.Z — тогда файлы прикрепляются к релизу.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libnss3 libfontconfig1 libdbus-1-3 libpulse0 libpulse-mainloop-glib0
      - run: python -m pip install -e .[dev]
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install --upgrade pip pyinstaller .
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/windows/muninhall.spec
      - name: Smoke test (the app starts, builds its library and exits)
        shell: pwsh
        run: |
          $env:MUNINHALL_SMOKE_TEST = '1'
          $env:MUNINHALL_SMOKE_TEST_FILE = "$PWD\smoke.txt"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath dist\Muninhall\Muninhall.exe -PassThru -Wait
          Get-Content smoke.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path smoke.txt -Pattern 'MUNINHALL_SMOKE_TEST ok' -Quiet)) { exit 1 }
      - name: Smoke test of the LitRes sign-in page (built-in Chromium)
        # не блокирует сборку: сайт ЛитРес может не открываться с серверов GitHub; отчёт и снимок — в артефакте
        continue-on-error: true
        shell: pwsh
        run: |
          $env:MUNINHALL_SMOKE_TEST = '1'
          $env:MUNINHALL_SMOKE_TEST_WEB = '1'
          $env:MUNINHALL_SMOKE_TEST_FILE = "$PWD\smoke-web.txt"
          $env:MUNINHALL_SMOKE_TEST_SHOT = "$PWD\smoke-web.png"
          $p = Start-Process -FilePath dist\Muninhall\Muninhall.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "web: the app hung (killed after 120 s)" | Add-Content smoke-web.txt }
          Get-Content smoke-web.txt
          if (-not (Select-String -Path smoke-web.txt -Pattern 'MUNINHALL_SMOKE_TEST web ok' -Quiet)) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-web-smoke
          path: |
            smoke-web.txt
            smoke-web.png
          if-no-files-found: ignore
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $v = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$v" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Muninhall-Setup-*.exe

  flatpak:
    needs: tests
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: Muninhall.flatpak
          manifest-path: packaging/flatpak/io.github.arvino_t.Muninhall.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Smoke test (the app starts, builds its library and exits)
        run: |
          flatpak install --user -y --noninteractive Muninhall.flatpak
          dbus-run-session -- flatpak run --env=MUNINHALL_SMOKE_TEST=1 --env=QT_QPA_PLATFORM=offscreen \
            io.github.arvino_t.Muninhall | tee smoke.txt
          grep -q 'MUNINHALL_SMOKE_TEST ok' smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Muninhall.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: "{windows,flatpak}"     # отчёт проверки входа (windows-web-smoke) — не для выпуска
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
