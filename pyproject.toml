[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muninhall"
version = "1.3.0"
description = "Muninhall — build, read and organize your own library of e-books and articles; LitRes as a pluggable library (Linux and Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.10,<6.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
muninhall = "muninhall.app:main"
# прежнее имя команды — для ярлыков и привычки
litres-reader = "muninhall.app:main"

[tool.setuptools]
packages = ["muninhall"]

[tool.setuptools.package-data]
muninhall = ["web/*", "web/vendor/*", "web/foliate/*", "web/foliate/vendor/*",
             "web/foliate/vendor/pdfjs/*", "web/foliate/vendor/pdfjs/cmaps/*",
             "web/foliate/vendor/pdfjs/standard_fonts/*", "data/*", "data/sym/*", "data/icons/*"]
